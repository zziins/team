<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LGE.SHOP - 가전 전문 쇼핑몰</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { lg: '#A50034', lgd: '#82002A', ink: '#2B2B2B' } } } };
</script>
<style>
  body { font-family: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; color:#2B2B2B; background:#fff; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:4px; padding:10px 16px; border-radius:6px; font-weight:600; font-size:14px; border:1px solid #d1d5db; background:#fff; color:#2B2B2B; cursor:pointer; transition:.15s; }
  .btn:hover:not(:disabled) { background:#f3f4f6; }
  .btn-p { background:#A50034; border-color:#A50034; color:#fff; }
  .btn-p:hover:not(:disabled) { background:#82002A; }
  .btn-d { background:#2B2B2B; border-color:#2B2B2B; color:#fff; }
  .btn-d:hover:not(:disabled) { background:#000; }
  .btn:disabled { background:#e5e7eb !important; border-color:#e5e7eb !important; color:#9ca3af !important; cursor:not-allowed; }
  .btn-sm { padding:6px 10px; font-size:12px; }
  .inp { width:100%; border:1px solid #d1d5db; border-radius:6px; padding:9px 12px; font-size:14px; background:#fff; }
  .inp:focus { outline:2px solid #A50034; outline-offset:-1px; border-color:#A50034; }
  .inp:disabled { background:#f3f4f6; color:#9ca3af; }
  .tab { padding:12px 18px; font-weight:600; font-size:15px; color:#6b7280; border-bottom:3px solid transparent; white-space:nowrap; cursor:pointer; background:none; }
  .tab-on { color:#A50034; border-bottom-color:#A50034; }
  .tab:disabled { color:#d1d5db; cursor:not-allowed; }
  .pcard { border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; cursor:pointer; background:#fff; transition:.15s; }
  .pcard:hover { box-shadow:0 6px 20px rgba(0,0,0,.1); transform:translateY(-2px); }
  .pimg { position:relative; height:170px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#f7f7f8,#ececef); }
  .badge-sold { position:absolute; top:10px; left:10px; background:#2B2B2B; color:#fff; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .box { border:1px solid #e5e7eb; border-radius:10px; padding:18px; background:#fff; }
  .st { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .toast { padding:12px 16px; border-radius:8px; color:#fff; font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,.25); animation:tin .25s ease; }
  @keyframes tin { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
  .ovl { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; display:flex; align-items:center; justify-content:center; padding:12px; }
  .mdl { background:#fff; border-radius:12px; max-width:420px; width:100%; padding:24px; }
  table.tb { width:100%; font-size:13px; border-collapse:collapse; min-width:560px; }
  table.tb th, table.tb td { border-bottom:1px solid #e5e7eb; padding:8px 6px; text-align:left; vertical-align:middle; }
  table.tb th { background:#f9fafb; font-weight:700; }
  input[type=checkbox], input[type=radio] { accent-color:#A50034; width:16px; height:16px; flex-shrink:0; }
  .tbl-wrap { overflow-x:auto; }
  .hint { font-size:12px; color:#6b7280; margin-top:4px; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- ===== 헤더 ===== -->
<header class="border-b border-gray-200 bg-white sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-3 py-3 flex flex-wrap items-center gap-x-3 gap-y-2">
    <a href="#" onclick="go('home');return false;" class="text-2xl font-black tracking-tight" style="color:#A50034">LGE<span class="text-ink">.SHOP</span></a>
    <span class="hidden md:inline text-xs text-gray-500">가전 전문 쇼핑몰</span>
    <nav id="nav" class="ml-auto flex flex-wrap items-center justify-end gap-1 text-sm font-semibold"></nav>
  </div>
</header>

<main id="app" class="flex-1 max-w-7xl w-full mx-auto px-3 py-5"></main>

<footer class="bg-gray-100 text-xs text-gray-500 py-5 mt-8">
  <div class="max-w-7xl mx-auto px-3 flex flex-wrap items-center justify-between gap-2">
    <span>LGE.SHOP · 블랙박스 테스트용 모의 쇼핑몰입니다. 실제 결제·배송이 이루어지지 않습니다.</span>
    <button id="btnReset" class="border border-gray-300 rounded px-2 py-1 text-[11px] text-gray-600 bg-white hover:bg-gray-50" onclick="resetAll()">테스트 데이터 초기화</button>
  </div>
</footer>

<div id="toasts" class="fixed top-16 right-3 left-3 sm:left-auto sm:w-96 z-50 flex flex-col gap-2 pointer-events-none"></div>
<div id="modal"></div>

<script>
/* =====================================================
   상수 / 시드 데이터
===================================================== */
const KEY = 'lgeshop_qa_v2';
const COUPONS = {
  welcome: { name: '웰컴 10% 할인 쿠폰 (최대 100,000원 한도)', rate: 0.10, max: 100000 },
  newbie:  { name: '신규가입 50,000원 정액 쿠폰', fixed: 50000 },
  vip:     { name: 'VIP 전용 15% 할인 쿠폰 (최대 200,000원 한도)', rate: 0.15, max: 200000, vip: true }
};
const STATUSES = ['결제완료', '설치일정확정', '배송·설치중', '설치완료'];
const FINAL = ['취소완료', '반품완료'];

function seed() {
  return {
    products: [
      { id: 1, rank: 1, cat: 'TV/영상', name: 'LG 올레드 evo 65형 TV', model: 'OLED65C5KNA', price: 3290000, sub: 59900, stock: 12, large: true, icon: '📺' },
      { id: 2, rank: 2, cat: 'TV/영상', name: 'LG QNED 55형 TV', model: '55QNED85KRA', price: 1190000, sub: 32900, stock: 8, large: true, icon: '🖥️' },
      { id: 3, rank: 3, cat: 'TV/영상', name: 'LG 스탠바이미 27형', model: '27ART10DKPL', price: 1090000, sub: 0, stock: 1, large: false, icon: '📱' },
      { id: 4, rank: 4, cat: '주방가전', name: 'LG 디오스 오브제컬렉션 냉장고 870L', model: 'M874GBB451', price: 2890000, sub: 54900, stock: 4, large: true, icon: '🧊' },
      { id: 5, rank: 5, cat: '주방가전', name: 'LG 디오스 광파오븐 39L', model: 'ML39BSW', price: 390000, sub: 0, stock: 20, large: false, icon: '🍳' },
      { id: 6, rank: 6, cat: '주방가전', name: 'LG 퓨리케어 냉온정수기', model: 'WD523ACB', price: 899000, sub: 36900, stock: 2, large: false, icon: '💧' },
      { id: 7, rank: 7, cat: '생활가전', name: 'LG 트롬 오브제컬렉션 세탁기 25kg', model: 'FX25ESR', price: 1690000, sub: 39900, stock: 6, large: true, icon: '🧺' },
      { id: 8, rank: 8, cat: '생활가전', name: 'LG 퓨리케어 360° 공기청정기', model: 'AS353NS4A', price: 490000, sub: 24900, stock: 15, large: false, icon: '🌬️' },
      { id: 9, rank: 9, cat: '생활가전', name: 'LG 코드제로 A9S 청소기', model: 'A9S-AI', price: 790000, sub: 0, stock: 1, large: false, icon: '🧹' }
    ],
    users: [
      { id: 'user01', pw: 'test1234!', name: '김일반', role: 'user', grade: 'normal', points: 5000, coupons: ['welcome', 'newbie'], used: [] },
      { id: 'vip01', pw: 'test1234!', name: '박브이', role: 'user', grade: 'vip', points: 50000, coupons: ['welcome', 'newbie', 'vip'], used: [] },
      { id: 'admin', pw: 'admin1234!', name: '관리자', role: 'admin', grade: 'admin', points: 0, coupons: [], used: [] }
    ],
    carts: {}, opts: {}, orders: [], seq: 1, lineSeq: 1, session: null, hideSold: false
  };
}
function load() {
  try { const r = localStorage.getItem(KEY); if (r) { const d = JSON.parse(r); if (d && d.products && d.users) return d; } } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let S = load();
function newV() { return { view: 'home', cat: '전체', q: '', sort: 'rec', pid: null, tab: 'lump', d: defD(), form: defForm(), next: null, receipt: null, adminTab: 'orders' }; }
function defD() { return { qty: 1, date: '', term: 4, care: 6, card: false }; }
function defForm() { return { name: '', phone: '', addr: '', ladder: false, pay: 'ok', review: 'ok' }; }
let V = newV();

/* =====================================================
   유틸
===================================================== */
const $ = s => document.querySelector(s);
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const P = id => S.products.find(p => p.id === Number(id));
const U = () => S.users.find(u => u.id === S.session) || null;
const cart = () => { const k = S.session || 'guest'; return S.carts[k] || (S.carts[k] = []); };
const optv = () => { const k = S.session || 'guest'; return S.opts[k] || (S.opts[k] = { coupon: '', points: 0 }); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gradeLabel = u => u.role === 'admin' ? '관리자' : (u.grade === 'vip' ? 'VIP' : '일반');
function dstr(off) {
  const d = new Date(); d.setDate(d.getDate() + off);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast pointer-events-auto';
  el.style.background = type === 'err' ? '#A50034' : type === 'ok' ? '#15803d' : type === 'warn' ? '#b45309' : '#2B2B2B';
  el.setAttribute('role', 'alert');
  el.textContent = (type === 'err' ? '⛔ ' : type === 'ok' ? '✅ ' : type === 'warn' ? '⚠️ ' : 'ℹ️ ') + msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 3200);
}
function modal(title, msg, type) {
  $('#modal').innerHTML = `<div class="ovl" onclick="if(event.target===this)closeModal()"><div class="mdl" role="dialog">
    <div class="text-lg font-bold mb-2" style="color:${type === 'err' ? '#A50034' : '#2B2B2B'}">${type === 'err' ? '⛔ ' : ''}${esc(title)}</div>
    <p class="text-sm text-gray-700 mb-5">${esc(msg)}</p>
    <button class="btn btn-p w-full" onclick="closeModal()">확인</button></div></div>`;
}
function closeModal() { $('#modal').innerHTML = ''; }
function statusClass(s) {
  return { '결제완료': 'bg-blue-100 text-blue-800', '설치일정확정': 'bg-indigo-100 text-indigo-800', '배송·설치중': 'bg-amber-100 text-amber-800', '설치완료': 'bg-green-100 text-green-800', '취소완료': 'bg-gray-200 text-gray-600', '반품완료': 'bg-purple-100 text-purple-800' }[s] || 'bg-gray-100';
}

/* =====================================================
   내비게이션 / 접근 제어
===================================================== */
function needLogin(v, pid) {
  V.next = { v, pid: pid == null ? null : pid };
  toast('로그인이 필요한 서비스입니다.', 'warn');
  V.view = 'login'; window.scrollTo(0, 0); render();
}
function go(view, pid) {
  if ((view === 'my' || view === 'checkout') && !U()) { needLogin(view); return; }
  if (view === 'admin') {
    if (!U()) { needLogin('admin'); return; }
    if (U().role !== 'admin') { toast('관리자만 접근할 수 있는 페이지입니다.', 'err'); view = 'home'; }
  }
  V.view = view;
  if (pid != null) V.pid = pid;
  if (view === 'detail') { V.tab = 'lump'; V.d = defD(); }
  window.scrollTo(0, 0);
  render();
}
function navHTML() {
  const u = U();
  const n = cart().reduce((s, l) => s + l.qty, 0);
  const cartBtn = `<button class="btn btn-sm" id="navCart" onclick="go('cart')">🛒 장바구니 (<span id="cnt">${n}</span>)</button>`;
  if (!u) return cartBtn + `<button class="btn btn-sm" id="navLogin" onclick="go('login')">로그인</button><button class="btn btn-sm btn-p" id="navSignup" onclick="go('signup')">회원가입</button>`;
  return `<span class="px-2 text-sm" id="who">${esc(u.name)}님 (${gradeLabel(u)})</span>` + cartBtn +
    `<button class="btn btn-sm" id="navMy" onclick="go('my')">마이페이지</button>` +
    (u.role === 'admin' ? `<button class="btn btn-sm btn-d" id="navAdmin" onclick="go('admin')">관리자 페이지</button>` : '') +
    `<button class="btn btn-sm" id="navLogout" onclick="logout()">로그아웃</button>`;
}
function render() {
  const u = U();
  if ((V.view === 'my' || V.view === 'checkout' || V.view === 'receipt') && !u) V.view = 'home';
  if (V.view === 'admin' && (!u || u.role !== 'admin')) V.view = 'home';
  $('#nav').innerHTML = navHTML();
  if (V.view === 'cart' || V.view === 'checkout') fixOpt();
  const views = { home: viewHome, detail: viewDetail, cart: viewCart, checkout: viewCheckout, receipt: viewReceipt, my: viewMy, login: viewLogin, signup: viewSignup, admin: viewAdmin };
  $('#app').innerHTML = (views[V.view] || viewHome)();
  if (V.view === 'detail') renderCalc();
}
function resetAll() {
  try { localStorage.removeItem(KEY); } catch (e) {}
  S = seed(); V = newV(); closeModal(); save(); render();
  toast('테스트 데이터가 초기화되었습니다.', 'ok');
}
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

/* =====================================================
   REQ-000 인증 / 회원
===================================================== */
function validateId(id) {
  if (!id) return '아이디를 입력해 주세요.';
  if (/[A-Z]/.test(id)) return '아이디에 대문자는 사용할 수 없습니다. 영문 소문자와 숫자만 입력해 주세요.';
  if (/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(id)) return '아이디에 한글은 사용할 수 없습니다. 영문 소문자와 숫자만 입력해 주세요.';
  if (/[^a-z0-9]/.test(id)) return '아이디에 특수문자·공백은 사용할 수 없습니다. 영문 소문자와 숫자만 입력해 주세요.';
  if (id.length < 4) return `아이디는 4자 이상이어야 합니다. (현재 ${id.length}자)`;
  if (id.length > 12) return `아이디는 12자 이하여야 합니다. (현재 ${id.length}자)`;
  if (S.users.some(u => u.id === id)) return '이미 사용 중인 아이디입니다.';
  return '';
}
function validatePw(pw) {
  if (!pw) return '비밀번호를 입력해 주세요.';
  if (pw.length < 8) return `비밀번호는 8자 이상이어야 합니다. (현재 ${pw.length}자)`;
  if (!/[A-Za-z]/.test(pw)) return '비밀번호에 영문자를 1개 이상 포함해야 합니다.';
  if (!/\d/.test(pw)) return '비밀번호에 숫자를 1개 이상 포함해야 합니다.';
  if (!/[!-\/:-@\[-`{-~]/.test(pw)) return '비밀번호에 특수문자를 1개 이상 포함해야 합니다.';
  return '';
}
function viewSignup() {
  return `<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-black mb-4">회원가입</h1>
  <form class="box space-y-4" onsubmit="return doSignup(event)" novalidate>
    <div><label class="text-sm font-bold">아이디</label>
      <div class="flex gap-2 mt-1"><input id="sId" class="inp" autocomplete="off" placeholder="영문 소문자·숫자 4~12자"><button type="button" class="btn btn-sm whitespace-nowrap" onclick="checkId()">중복확인</button></div>
      <div class="hint">영문 소문자와 숫자만 사용, 4~12자</div></div>
    <div><label class="text-sm font-bold">비밀번호</label>
      <input id="sPw" type="password" class="inp mt-1" autocomplete="new-password" placeholder="8자 이상">
      <div class="hint">8자 이상, 영문 + 숫자 + 특수문자 각 1개 이상 포함</div></div>
    <div><label class="text-sm font-bold">비밀번호 확인</label>
      <input id="sPw2" type="password" class="inp mt-1" autocomplete="new-password" placeholder="비밀번호 재입력"></div>
    <div><label class="text-sm font-bold">이름</label>
      <input id="sName" class="inp mt-1" autocomplete="off" placeholder="2~10자"></div>
    <button class="btn btn-p w-full py-3" id="btnSignup" type="submit">가입하기</button>
    <div class="text-xs text-gray-500">가입 시 일반 회원 등급, 축하 포인트 5,000P, 웰컴·신규가입 쿠폰이 자동 지급됩니다.</div>
    <div class="text-sm text-center">이미 계정이 있으신가요? <a href="#" class="font-bold underline" style="color:#A50034" onclick="go('login');return false;">로그인</a></div>
  </form></div>`;
}
function checkId() {
  const m = validateId($('#sId').value);
  if (m) toast(m, 'err'); else toast('사용 가능한 아이디입니다.', 'ok');
}
function doSignup(e) {
  e.preventDefault();
  const id = $('#sId').value, pw = $('#sPw').value, pw2 = $('#sPw2').value, nm = $('#sName').value.trim();
  let m = validateId(id);
  if (m) { toast(m, 'err'); $('#sId').focus(); return false; }
  m = validatePw(pw);
  if (m) { toast(m, 'err'); $('#sPw').focus(); return false; }
  if (pw !== pw2) { toast('비밀번호가 일치하지 않습니다. 비밀번호 확인을 다시 입력해 주세요.', 'err'); $('#sPw2').focus(); return false; }
  const nl = [...nm].length;
  if (nl < 2 || nl > 10) { toast(`이름은 2자 이상 10자 이하로 입력해 주세요. (현재 ${nl}자)`, 'err'); $('#sName').focus(); return false; }
  S.users.push({ id, pw, name: nm, role: 'user', grade: 'normal', points: 5000, coupons: ['welcome', 'newbie'], used: [] });
  save();
  V.view = 'login'; V.loginId = id; render();
  toast('회원가입이 완료되었습니다. 가입 축하 포인트 5,000P와 쿠폰 2종이 지급되었습니다. 로그인해 주세요.', 'ok');
  return false;
}
function viewLogin() {
  const pre = V.loginId || ''; V.loginId = '';
  return `<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-black mb-4">로그인</h1>
  <form class="box space-y-4" onsubmit="return doLogin(event)" novalidate>
    <div><label class="text-sm font-bold">아이디</label><input id="lId" class="inp mt-1" autocomplete="username" value="${esc(pre)}" placeholder="아이디"></div>
    <div><label class="text-sm font-bold">비밀번호</label><input id="lPw" type="password" class="inp mt-1" autocomplete="current-password" placeholder="비밀번호"></div>
    <button class="btn btn-p w-full py-3" id="btnLogin" type="submit">로그인</button>
    <div class="text-sm text-center">계정이 없으신가요? <a href="#" class="font-bold underline" style="color:#A50034" onclick="go('signup');return false;">회원가입</a></div>
  </form>
  <div class="box mt-4 bg-gray-50">
    <div class="text-sm font-bold mb-2">🧪 테스트 계정 원클릭 입력</div>
    <div class="grid gap-2">
      <button type="button" class="btn btn-sm justify-between" onclick="fillLogin('user01','test1234!')"><span>일반 회원 · user01</span><span class="text-gray-500 font-normal">보유 5,000P</span></button>
      <button type="button" class="btn btn-sm justify-between" onclick="fillLogin('vip01','test1234!')"><span>VIP 회원 · vip01</span><span class="text-gray-500 font-normal">50,000P · VIP 쿠폰</span></button>

/* =====================================================
   검증 / 계산
===================================================== */
function validateDate(v) {
  if (!v) return '희망 설치일을 선택해 주세요.';
  if (v < dstr(2)) return '오늘 및 내일(D+1)은 설치일로 선택할 수 없습니다. 모레(D+2)부터 선택해 주세요.';
  if (v > dstr(30)) return '희망 설치일은 오늘로부터 최대 30일 이내만 선택할 수 있습니다.';
  return '';
}
function validateQty(raw, p) {
  const s = String(raw).trim();
  if (s === '') return { ok: false, msg: '구매 수량을 입력해 주세요.' };
  const n = Number(s);
  if (!Number.isInteger(n)) return { ok: false, msg: '수량은 정수로 입력해 주세요.' };
  if (n < 1) return { ok: false, msg: '구매 수량은 최소 1개 이상이어야 합니다.' };
  if (n > 3) return { ok: false, msg: '구매 수량은 최대 3개까지 가능합니다.' };
  if (n > p.stock) return { ok: false, msg: `재고가 부족합니다. 현재 잔여 재고는 ${p.stock}개입니다.` };
  return { ok: true, n };
}
function monthly(p, term, care, card) {
  const base = p.sub;
  const promo = term === 4 ? Math.round(base * 0.5) : 0;
  const careFee = care === 4 ? 3000 : 0;
  const cardDisc = card ? 20000 : 0;
  const raw = base - promo + careFee - cardDisc;
  return { base, promo, careFee, cardDisc, raw, final: Math.max(0, raw) };
}
function lineUnit(l) { const p = P(l.pid); return l.type === 'lump' ? p.price : monthly(p, l.term, l.care, l.card).final; }
function lineDesc(l) {
  if (l.type === 'lump') return `일시불 · 설치희망일 ${l.date}`;
  return `구독 · ${l.term}년 약정 · 케어십 ${l.care}개월 주기${l.card ? ' · 제휴카드 할인' : ''}`;
}
function couponAmt(key, base) {
  const c = COUPONS[key];
  if (c.fixed) return Math.min(c.fixed, base);
  return Math.min(Math.floor(base * c.rate), c.max);
}
function calc(coupon, pts) {
  const u = U();
  const L = cart().filter(l => l.sel);
  const lump = L.filter(l => l.type === 'lump');
  const sub = L.filter(l => l.type === 'sub');
  const subtotal = lump.reduce((s, l) => s + P(l.pid).price * l.qty, 0);
  const models = new Set(lump.map(l => l.pid));
  const bundle = models.size >= 2 ? Math.floor(subtotal * 0.03) : 0;
  const afterB = subtotal - bundle;
  let cAmt = 0, cErr = '';
  if (coupon) {
    const c = COUPONS[coupon];
    if (!c) cErr = '존재하지 않는 쿠폰입니다.';
    else if (!u) cErr = '로그인 후 쿠폰을 사용할 수 있습니다.';
    else if (!u.coupons.includes(coupon)) cErr = '보유하지 않은 쿠폰입니다.';
    else if (c.vip && u.grade !== 'vip') cErr = 'VIP 전용 쿠폰은 VIP 회원만 사용할 수 있습니다.';
    else if (u.used.includes(coupon)) cErr = '이미 사용한 쿠폰입니다.';
    else if (!lump.length) cErr = '구독 상품만 담은 경우 일시불 전용 쿠폰을 적용할 수 없습니다.';
    else cAmt = couponAmt(coupon, afterB);
  }
  const afterC = afterB - cAmt;
  const payable = afterC - pts;
  const monthlySum = sub.reduce((s, l) => s + lineUnit(l), 0);
  const large = L.some(l => P(l.pid).large);
  return { L, lump, sub, subtotal, models: models.size, bundle, afterB, cAmt, cErr, afterC, payable, monthlySum, large };
}
function fixOpt() {
  const o = optv(), u = U();
  let c = calc(o.coupon, 0);
  if (c.cErr) { toast(c.cErr + ' 쿠폰 선택이 해제되었습니다.', 'warn'); o.coupon = ''; c = calc('', 0); }
  if (o.points > 0) {
    const maxp = Math.min(u ? u.points : 0, Math.floor(c.afterC / 100) * 100);
    if (o.points > maxp) { toast('주문 구성/보유 포인트 변경으로 사용 포인트가 조정되었습니다.', 'warn'); o.points = Math.max(0, maxp); }
  }
  save();
}

    const r = validateQty($('#inQty').value, p);
    if (!r.ok) { toast(r.msg, 'err'); $('#inQty').value = V.d.qty; return; }
    const cand = { pid: p.id, type: 'lump', date };
    const ex = cl.find(l => sameLine(l, cand));
    if (ex) {
      const r2 = validateQty(String(ex.qty + r.n), p);
      if (!r2.ok) { toast('장바구니에 이미 ' + ex.qty + '개가 담겨 있습니다. ' + r2.msg, 'err'); return; }
      ex.qty = r2.n; line = ex;
    } else {
      line = { id: 'L' + (S.lineSeq++), pid: p.id, type: 'lump', qty: r.n, date, sel: true };
      cl.push(line);
    }
  } else {
    const d = V.d;
    const cand = { pid: p.id, type: 'sub', term: d.term, care: d.care, card: d.card };
    const ex = cl.find(l => sameLine(l, cand));
    if (ex) { line = ex; if (!buyNow) { toast('동일한 구독 옵션이 이미 장바구니에 있습니다.', 'warn'); return; } }
    else { line = { id: 'L' + (S.lineSeq++), pid: p.id, type: 'sub', qty: 1, term: d.term, care: d.care, card: d.card, sel: true }; cl.push(line); }
  }
  if (buyNow) { cl.forEach(l => l.sel = (l.id === line.id)); save(); go('checkout'); return; }
  save(); render();
  toast('장바구니에 담았습니다.', 'ok');
}

function cartDel(id) { S.carts[S.session || 'guest'] = cart().filter(l => l.id !== id); save(); render(); toast('상품을 삭제했습니다.', 'info'); }

  if (c.lump.length && V.form.pay === 'fail') {

    <div class="text-center mb-5"><div class="text-5xl mb-2">🎉</div><h1 class="text-2xl font-black">주문이 완료되었습니다</h1><p class="text-sm text-gray-500 mt-1">주문 내역은 마이페이지에서 조회할 수 있습니다.</p></div>
    <div class="box space-y-3 text-sm" id="receipt">
      <div class="flex justify-between"><span class="text-gray-500">주문번호</span><b id="rcptNo">${o.id}</b></div>
      <div class="flex justify-between"><span class="text-gray-500">주문일시</span><span>${new Date(o.created).toLocaleString('ko-KR')}</span></div>
      <div class="flex justify-between"><span class="text-gray-500">수령인</span><span>${esc(o.name)} (${esc(o.phone)})</span></div>
      <div class="flex justify-between gap-4"><span class="text-gray-500 shrink-0">배송지</span><span class="text-right">${esc(o.addr)}</span></div>
      <div class="border-t pt-3"><div class="text-gray-500 mb-1">설치 희망일 요약</div><ul class="space-y-1 list-none">${dates}${subs}</ul></div>
      <div class="border-t pt-3 flex justify-between items-baseline"><b>결제 금액</b><b id="rcptPay" class="text-2xl" style="color:#A50034">${won(o.payable)}</b></div>
      ${o.monthlySum ? `<div class="flex justify-between"><span>구독 월 요금</span><b style="color:#A50034">월 ${won(o.monthlySum)}</b></div>` : ''}
      <div class="text-xs text-gray-500">할인: 결합 ${won(o.bundle)} · 쿠폰 ${won(o.couponAmt)} · 포인트 ${o.points.toLocaleString()}P</div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-4"><button class="btn" onclick="go('home')">쇼핑 계속하기</button><button class="btn btn-p" onclick="go('my')">마이페이지에서 보기</button></div>
  </div>`;
}

/* =====================================================
   REQ-005 마이페이지
===================================================== */
function viewMy() {
  const u = U();
  const orders = S.orders.filter(o => o.userId === u.id).slice().reverse();
  const coupons = u.coupons.length ? u.coupons.map(k => {
    const cp = COUPONS[k]; const used = u.used.includes(k); const lock = cp.vip && u.grade !== 'vip';
    return `<div class="flex justify-between items-center gap-2 text-sm py-1"><span>${cp.name}</span><span class="st shrink-0 ${used ? 'bg-gray-200 text-gray-600' : lock ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}">${used ? '사용완료' : lock ? 'VIP 전용' : '사용가능'}</span></div>`;
  }).join('') : '<div class="text-sm text-gray-500">보유한 쿠폰이 없습니다.</div>';
  return `
  <h1 class="text-2xl font-black mb-4">마이페이지</h1>
  <div class="grid md:grid-cols-3 gap-4 mb-4">
    <div class="box"><div class="text-xs text-gray-500">회원 정보</div><div class="text-lg font-black mt-1">${esc(u.name)} <span class="text-sm font-normal text-gray-500">(${esc(u.id)})</span></div><div class="mt-1 text-sm">등급 <b id="myGrade" style="color:#A50034">${u.role === 'admin' ? '관리자' : u.grade === 'vip' ? 'VIP 회원' : '일반 회원'}</b></div></div>
    <div class="box"><div class="text-xs text-gray-500">보유 포인트</div><div class="text-2xl font-black mt-1" id="myPoints">${u.points.toLocaleString()}P</div></div>
    <div class="box"><div class="text-xs text-gray-500 mb-1">보유 쿠폰</div>${coupons}</div>
  </div>
  <div class="box mb-6">
    <div class="font-bold mb-3">비밀번호 변경</div>
    <form class="grid md:grid-cols-4 gap-2 items-start" onsubmit="return changePw(event)" novalidate>
      <input id="cpCur" type="password" class="inp" placeholder="현재 비밀번호" autocomplete="current-password">
      <input id="cpNew" type="password" class="inp" placeholder="새 비밀번호" autocomplete="new-password">
      <input id="cpNew2" type="password" class="inp" placeholder="새 비밀번호 확인" autocomplete="new-password">
      <button class="btn btn-d" id="btnChangePw" type="submit">변경</button>
    </form>
    <div class="hint">8자 이상, 영문 + 숫자 + 특수문자 각 1개 이상 포함</div>
  </div>
  <h2 class="text-lg font-bold mb-3">주문 내역 <span class="text-sm font-normal text-gray-500">(${orders.length}건)</span></h2>
  ${orders.length ? orders.map(orderCard).join('') : '<div class="box text-center py-14 text-gray-500">주문 내역이 없습니다.</div>'}`;
}
function changePw(e) {
  e.preventDefault();
  const u = U(); if (!u) return false;
  const cur = $('#cpCur').value, n1 = $('#cpNew').value, n2 = $('#cpNew2').value;
  if (!cur) { toast('현재 비밀번호를 입력해 주세요.', 'err'); return false; }
  if (cur !== u.pw) { toast('현재 비밀번호가 일치하지 않습니다.', 'err'); return false; }
  const m = validatePw(n1);
  if (m) { toast('새 ' + m, 'err'); return false; }
  if (n1 === cur) { toast('새 비밀번호는 현재 비밀번호와 달라야 합니다.', 'err'); return false; }
  if (n1 !== n2) { toast('새 비밀번호 확인이 일치하지 않습니다.', 'err'); return false; }
  u.pw = n1; save();
  ['#cpCur', '#cpNew', '#cpNew2'].forEach(s => $(s).value = '');
  toast('비밀번호가 변경되었습니다.', 'ok');
  return false;
}
function orderCard(o) {
  const final = FINAL.includes(o.status);
  const idx = STATUSES.indexOf(o.status);
  const steps = final ? '' : `<div class="flex items-center gap-1 text-xs mt-2 flex-wrap">${STATUSES.map((s, i) => `<span class="st ${i <= idx ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-400'}">${s}</span>${i < 3 ? '<span class="text-gray-300">›</span>' : ''}`).join('')}</div>`;
  const canCancel = o.status === '결제완료' || o.status === '설치일정확정';
  const canReturn = o.status === '배송·설치중' || o.status === '설치완료';
  const items = o.items.map(i => `<div class="flex justify-between gap-2 text-sm py-1"><span>${i.icon} ${esc(i.name)} <span class="text-xs text-gray-500">${i.type === 'lump' ? '일시불 · ' + i.qty + '개 · 설치 ' + i.date : '구독 · ' + i.term + '년 · 케어십 ' + i.care + '개월' + (i.card ? ' · 제휴카드' : '')}</span></span><span class="font-semibold whitespace-nowrap">${i.type === 'lump' ? won(i.unit * i.qty) : '월 ' + won(i.unit)}</span></div>`).join('');
  return `<div class="box mb-4" data-order="${o.id}">
    <div class="flex flex-wrap justify-between items-start gap-2">
      <div><div class="font-bold">${o.id}</div><div class="text-xs text-gray-500">${new Date(o.created).toLocaleString('ko-KR')} · 수령인 ${esc(o.name)} · ${esc(o.addr)}</div></div>
      <span class="st ${statusClass(o.status)}" data-status>${o.status}</span>
    </div>
    ${steps}
    <div class="mt-3 border-t pt-2">${items}</div>
    <div class="mt-2 text-sm bg-gray-50 rounded-lg p-3 space-y-1">
      <div class="font-semibold">적용된 할인 내역</div>
      <div class="flex justify-between"><span>일시불 합계</span><span>${won(o.subtotal)}</span></div>
      <div class="flex justify-between"><span>다품목 결합 할인</span><span>${o.bundle ? '-' + won(o.bundle) : '없음'}</span></div>
      <div class="flex justify-between gap-2"><span>쿠폰${o.couponKey ? ' (' + COUPONS[o.couponKey].name.split(' (')[0] + ')' : ''}</span><span>${o.couponAmt ? '-' + won(o.couponAmt) : '없음'}</span></div>
      <div class="flex justify-between"><span>포인트 사용</span><span>${o.points ? '-' + o.points.toLocaleString() + 'P' : '없음'}</span></div>
      <div class="flex justify-between border-t pt-1 font-bold"><span>결제 금액</span><span style="color:#A50034">${won(o.payable)}${o.monthlySum ? ' + 월 ' + won(o.monthlySum) : ''}</span></div>
    </div>
    <div class="mt-3 flex gap-2 justify-end">
      ${canCancel ? `<button class="btn btn-sm" data-act="cancel" onclick="cancelOrder('${o.id}')">주문 취소</button>` : ''}
      ${canReturn ? (o.returnReq ? `<button class="btn btn-sm" disabled>반품 신청 접수됨 (승인 대기)</button>` : `<button class="btn btn-sm btn-d" data-act="return" onclick="returnOrder('${o.id}')">반품 신청</button>`) : ''}
    </div></div>`;
}
function restoreOrder(o) {
  o.items.forEach(i => { const p = P(i.pid); if (p) p.stock += i.qty; });
  const u = S.users.find(x => x.id === o.userId);
  if (u) { if (o.couponKey) u.used = u.used.filter(k => k !== o.couponKey); u.points += o.points; }
}
function cancelOrder(id) {
  const o = S.orders.find(x => x.id === id);
  if (!o || o.userId !== S.session) return;
  if (!(o.status === '결제완료' || o.status === '설치일정확정')) { toast('현재 상태에서는 주문을 취소할 수 없습니다.', 'err'); render(); return; }
  restoreOrder(o); o.status = '취소완료';
  save(); render();
  toast('주문이 취소되었습니다. 재고·쿠폰·포인트가 복구되었습니다.', 'ok');
}
function returnOrder(id) {
  const o = S.orders.find(x => x.id === id);
  if (!o || o.userId !== S.session) return;
  if (!(o.status === '배송·설치중' || o.status === '설치완료')) { toast('현재 상태에서는 반품을 신청할 수 없습니다.', 'err'); render(); return; }
  o.returnReq = true; save(); render();
  toast('반품 신청이 접수되었습니다. 관리자 승인 후 처리됩니다.', 'ok');
}

/* =====================================================
   관리자 페이지
===================================================== */
function viewAdmin() {
  const tabs = [['orders', '전체 주문 관리'], ['stock', '상품 재고 관리'], ['members', '회원 등급 관리']];
  let body = '';
  if (V.adminTab === 'orders') {
    const orders = S.orders.slice().reverse();
    body = `<div class="tbl-wrap"><table class="tb"><thead><tr><th>주문번호</th><th>회원</th><th>상품</th><th>결제금액</th><th>상태 변경</th><th>반품</th></tr></thead><tbody>
    ${orders.length ? orders.map(o => {
      const fin = FINAL.includes(o.status);
      const un = S.users.find(x => x.id === o.userId);
      return `<tr data-order="${o.id}"><td class="whitespace-nowrap">${o.id}</td><td>${esc(un ? un.name : o.userId)}<div class="text-xs text-gray-500">${esc(o.userId)}</div></td>
        <td>${o.items.map(i => esc(i.name) + (i.type === 'lump' ? ' ×' + i.qty : ' (구독)')).join('<br>')}</td>
        <td class="whitespace-nowrap">${won(o.payable)}</td>
        <td>${fin ? `<span class="st ${statusClass(o.status)}">${o.status}</span>` : `<select class="inp" style="padding:5px" onchange="adminStatus('${o.id}',this.value)">${STATUSES.map(s => `<option ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`}</td>
        <td>${o.returnReq && !fin ? `<span class="st bg-red-100 text-red-800 mb-1">반품 신청됨</span><br><button class="btn btn-sm btn-p" data-act="approve" onclick="adminApproveReturn('${o.id}')">반품 승인 완료</button>` : fin && o.status === '반품완료' ? '<span class="text-xs text-gray-500">처리 완료</span>' : '-'}</td></tr>`;
    }).join('') : '<tr><td colspan="6" class="text-gray-500 text-center py-6">생성된 주문이 없습니다.</td></tr>'}
    </tbody></table></div>`;
  } else if (V.adminTab === 'stock') {
    body = `<div class="tbl-wrap"><table class="tb"><thead><tr><th>상품</th><th>현재 재고</th><th>재고 수정 (0 이상 정수)</th></tr></thead><tbody>
    ${S.products.map(p => `<tr data-pid="${p.id}"><td>${p.icon} ${esc(p.name)}<div class="text-xs text-gray-500">${esc(p.model)}</div></td>
      <td>${p.stock <= 0 ? '<span class="st bg-red-100 text-red-700">일시품절</span>' : p.stock + '개'}</td>
      <td><div class="flex gap-1"><input id="st${p.id}" type="text" inputmode="numeric" class="inp" style="max-width:90px;padding:5px" value="${p.stock}"><button class="btn btn-sm btn-p" onclick="adminStock(${p.id})">저장</button></div></td></tr>`).join('')}
    </tbody></table></div>`;
  } else {
    body = `<div class="tbl-wrap"><table class="tb"><thead><tr><th>아이디</th><th>이름</th><th>현재 등급</th><th>보유 포인트</th><th>등급 변경</th></tr></thead><tbody>
    ${S.users.map(u => `<tr data-user="${u.id}"><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td><span class="st ${u.role === 'admin' ? 'bg-gray-800 text-white' : u.grade === 'vip' ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-700'}">${u.role === 'admin' ? '관리자' : u.grade === 'vip' ? 'VIP 회원' : '일반 회원'}</span></td><td>${u.points.toLocaleString()}P</td>
      <td>${u.role === 'admin' ? '<span class="text-xs text-gray-500">변경 불가</span>' : `<button class="btn btn-sm" onclick="adminGrade('${u.id}','${u.grade === 'vip' ? 'normal' : 'vip'}')">${u.grade === 'vip' ? '일반 회원으로 전환' : 'VIP 회원으로 전환'}</button>`}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  return `<h1 class="text-2xl font-black mb-4">🔧 관리자 페이지</h1>
  <div class="flex gap-1 overflow-x-auto border-b border-gray-200 mb-4">${tabs.map(t => `<button class="tab ${V.adminTab === t[0] ? 'tab-on' : ''}" onclick="V.adminTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
  <div class="box">${body}</div>`;
}
function isAdmin() { const u = U(); return !!(u && u.role === 'admin'); }
function adminStatus(id, val) {
  if (!isAdmin()) { toast('관리자만 사용할 수 있습니다.', 'err'); return; }
  const o = S.orders.find(x => x.id === id);
  if (!o || !STATUSES.includes(val) || FINAL.includes(o.status)) return;
  o.status = val;
  if (val === '결제완료' || val === '설치일정확정') o.returnReq = false;
  save(); render();
  toast(id + ' 상태가 [' + val + ']로 변경되었습니다.', 'ok');
}
function adminApproveReturn(id) {
  if (!isAdmin()) { toast('관리자만 사용할 수 있습니다.', 'err'); return; }
  const o = S.orders.find(x => x.id === id);
  if (!o || !o.returnReq || FINAL.includes(o.status)) { toast('승인할 수 있는 반품 신청이 아닙니다.', 'err'); return; }
  restoreOrder(o); o.status = '반품완료'; o.returnReq = false;
  save(); render();
  toast(id + ' 반품이 승인되어 재고·쿠폰·포인트가 복구되었습니다.', 'ok');
}
function adminStock(pid) {
  if (!isAdmin()) { toast('관리자만 사용할 수 있습니다.', 'err'); return; }
  const el = $('#st' + pid); const raw = el.value.trim();
  if (raw === '') { toast('재고 수량을 입력해 주세요.', 'err'); return; }
  const n = Number(raw);
  if (!/^-?\d+$/.test(raw) || isNaN(n)) { toast('재고는 정수로만 입력할 수 있습니다.', 'err'); return; }
  if (n < 0) { toast('재고는 음수로 입력할 수 없습니다.', 'err'); el.value = P(pid).stock; return; }
  P(pid).stock = n; save(); render();
  toast(P(pid).name + ' 재고가 ' + n + '개로 수정되었습니다.' + (n === 0 ? ' (일시품절 처리)' : ''), 'ok');
}
function adminGrade(uid, g) {
  if (!isAdmin()) { toast('관리자만 사용할 수 있습니다.', 'err'); return; }
  const u = S.users.find(x => x.id === uid);
  if (!u || u.role === 'admin') return;
  u.grade = g;
  if (g === 'vip' && !u.coupons.includes('vip')) u.coupons.push('vip');
  save(); render();
  toast(u.name + '(' + u.id + ') 회원이 ' + (g === 'vip' ? 'VIP 회원' : '일반 회원') + '으로 전환되었습니다.', 'ok');
}

/* 초기 렌더 */
render();
</script>
</body>
</html>
